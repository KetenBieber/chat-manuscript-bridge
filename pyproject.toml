[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-manuscript-bridge"
version = "0.3.0"
description = "MCP manuscript archival, verified publication handoff, PDF posters and Feishu IM alerts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Ketan Lin"}]
keywords = ["mcp", "chatgpt", "markdown", "manuscript", "github", "feishu", "pdf", "publishing"]
dependencies = [
  "mcp>=1.28,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<10", "httpx>=0.27,<1"]
poster = ["PyMuPDF>=1.24,<2", "Pillow>=10,<13"]

[project.scripts]
chat-manuscript-bridge = "chat_manuscript_bridge.server:main"
chat-manuscript-poster = "chat_manuscript_bridge.poster_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
